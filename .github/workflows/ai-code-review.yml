name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: rubensflinco/gemini-code-review-action@main
        with:
          gemini_api_key: ${{ secrets.AI_CODE_REVIEW }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-2.5-flash'
