name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: rubensflinco/code-review-by-gemini-ai@v1.0.5
        with:
          gemini_api_key: ${{ secrets.AI_CODE_REVIEW }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-2.5-flash'
